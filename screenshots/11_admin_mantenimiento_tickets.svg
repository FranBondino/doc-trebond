<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 520" width="100%" height="100%" style="background:#F8FAFC; border-radius:12px; font-family:'Inter', system-ui, sans-serif;">
  <!-- Window top bar -->
  <rect x="0" y="0" width="1000" height="48" fill="#1E293B"/>
  <circle cx="25" cy="24" r="5" fill="#EF4444"/>
  <circle cx="42" cy="24" r="5" fill="#F59E0B"/>
  <circle cx="59" cy="24" r="5" fill="#10B981"/>
  <text x="500" y="30" fill="#94A3B8" font-size="12" font-weight="600" text-anchor="middle">trebond-frontend.vercel.app/admin/mantenimiento — Gestión de Incidencias y Proveedores</text>

  <!-- Top Action Header -->
  <g transform="translate(30, 68)">
    <text x="0" y="24" fill="#262960" font-size="20" font-weight="900">Mantenimiento y Reparaciones</text>
    <text x="0" y="44" fill="#64748B" font-size="12">Seguimiento de reclamos de inquilinos, asignación de contratistas y aprobación de presupuestos</text>
    
    <rect x="740" y="6" width="190" height="36" rx="8" fill="#262960"/>
    <text x="835" y="29" fill="#FFFFFF" font-size="12" font-weight="700" text-anchor="middle">+ Nueva Incidencia</text>
  </g>

  <!-- Status Pillars -->
  <g transform="translate(30, 130)">
    <!-- Column 1: Pendiente de Asignar -->
    <rect x="0" y="0" width="220" height="360" rx="10" fill="#F1F5F9" stroke="#E2E8F0"/>
    <text x="16" y="26" fill="#D97706" font-size="11" font-weight="800">PENDIENTE ASIGNAR (1)</text>

    <!-- Card 1 -->
    <rect x="12" y="42" width="196" height="130" rx="8" fill="#FFFFFF" stroke="#CBD5E1"/>
    <rect x="22" y="52" width="56" height="18" rx="4" fill="#FEE2E2"/>
    <text x="50" y="65" fill="#991B1B" font-size="9.5" font-weight="800" text-anchor="middle">URGENTE</text>
    <text x="22" y="90" fill="#0F172A" font-size="12" font-weight="800">Filtración cañería baño</text>
    <text x="22" y="108" fill="#64748B" font-size="10.5">Bv. Oroño 1420 4to A</text>
    <text x="22" y="126" fill="#64748B" font-size="10.5">Reclamo: Carlos Inquilino</text>
    <rect x="22" y="136" width="80" height="22" rx="4" fill="#262960"/>
    <text x="62" y="151" fill="#FFFFFF" font-size="9.5" font-weight="700" text-anchor="middle">Asignar Provee.</text>

    <!-- Column 2: En Presupuesto -->
    <rect x="240" y="0" width="220" height="360" rx="10" fill="#F1F5F9" stroke="#E2E8F0"/>
    <text x="256" y="26" fill="#0284C7" font-size="11" font-weight="800">PRESUPUESTO RECIBIDO (1)</text>

    <!-- Card 2 -->
    <rect x="252" y="42" width="196" height="150" rx="8" fill="#FFFFFF" stroke="#CBD5E1"/>
    <rect x="262" y="52" width="68" height="18" rx="4" fill="#E0F2FE"/>
    <text x="296" y="65" fill="#0369A1" font-size="9.5" font-weight="800" text-anchor="middle">MODERADO</text>
    <text x="262" y="90" fill="#0F172A" font-size="12" font-weight="800">Service calefón Rheem</text>
    <text x="262" y="108" fill="#64748B" font-size="10.5">Córdoba 2150 2do B</text>
    <text x="262" y="126" fill="#166534" font-size="11" font-weight="800">Presupuesto: $42.000</text>
    <text x="262" y="142" fill="#64748B" font-size="10.5">Gasista: Ing. Ramos</text>
    <rect x="262" y="154" width="88" height="24" rx="4" fill="#10B981"/>
    <text x="306" y="170" fill="#FFFFFF" font-size="9.5" font-weight="800" text-anchor="middle">Aprobar Gasto</text>

    <!-- Column 3: En Reparación -->
    <rect x="480" y="0" width="220" height="360" rx="10" fill="#F1F5F9" stroke="#E2E8F0"/>
    <text x="496" y="26" fill="#7C3AED" font-size="11" font-weight="800">EN CURSO DE VISITA (1)</text>

    <!-- Card 3 -->
    <rect x="492" y="42" width="196" height="130" rx="8" fill="#FFFFFF" stroke="#CBD5E1"/>
    <rect x="502" y="52" width="60" height="18" rx="4" fill="#F3E8FF"/>
    <text x="532" y="65" fill="#6B21A8" font-size="9.5" font-weight="800" text-anchor="middle">EN CURSO</text>
    <text x="502" y="90" fill="#0F172A" font-size="12" font-weight="800">Cambio cerradura puerta</text>
    <text x="502" y="108" fill="#64748B" font-size="10.5">Paraguay 850 1er Piso</text>
    <text x="502" y="126" fill="#64748B" font-size="10.5">Cerrajero: Cerrajería Centro</text>
    <text x="502" y="146" fill="#D97706" font-size="10.5" font-weight="700">Turno: Hoy 16:30 hs</text>

    <!-- Column 4: Resuelto / Imputado -->
    <rect x="720" y="0" width="220" height="360" rx="10" fill="#F1F5F9" stroke="#E2E8F0"/>
    <text x="736" y="26" fill="#166534" font-size="11" font-weight="800">FINALIZADO E IMPUTADO (2)</text>

    <!-- Card 4 -->
    <rect x="732" y="42" width="196" height="110" rx="8" fill="#FFFFFF" stroke="#CBD5E1"/>
    <rect x="742" y="52" width="56" height="18" rx="4" fill="#DCFCE7"/>
    <text x="770" y="65" fill="#166534" font-size="9.5" font-weight="800" text-anchor="middle">✓ CERRADO</text>
    <text x="742" y="90" fill="#0F172A" font-size="12" font-weight="800">Reparación persiana balcón</text>
    <text x="742" y="108" fill="#64748B" font-size="10.5">Monto: $28.000 (Imputado)</text>
    <text x="742" y="126" fill="#10B981" font-size="10" font-weight="700">Factura #F-4410 asentada</text>
  </g>
</svg>
