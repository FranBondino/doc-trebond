<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 520" width="100%" height="100%" style="background:#0F172A; border-radius:12px; font-family:'Inter', system-ui, sans-serif;">
  <defs>
    <linearGradient id="primaryGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#262960"/>
      <stop offset="100%" stop-color="#101C36"/>
    </linearGradient>
    <linearGradient id="mintGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#C4E0CE"/>
      <stop offset="100%" stop-color="#93BFA3"/>
    </linearGradient>
    <linearGradient id="accentCyan" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#38BDF8"/>
      <stop offset="100%" stop-color="#0284C7"/>
    </linearGradient>
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="6" result="blur"/>
      <feComposite in="SourceGraphic" in2="blur" operator="over"/>
    </filter>
  </defs>

  <!-- Top bar -->
  <rect x="0" y="0" width="1000" height="52" fill="#1E293B"/>
  <circle cx="30" cy="26" r="6" fill="#EF4444"/>
  <circle cx="50" cy="26" r="6" fill="#F59E0B"/>
  <circle cx="70" cy="26" r="6" fill="#10B981"/>
  <text x="500" y="32" fill="#94A3B8" font-size="13" font-weight="600" text-anchor="middle">
    trebond-frontend.vercel.app/portal/contratos/ct-2026-04/firmar — Validación Biométrica Facial y Firma OTP
  </text>
  <rect x="850" y="14" width="120" height="24" rx="12" fill="#262960"/>
  <text x="910" y="30" fill="#C4E0CE" font-size="10.5" font-weight="800" text-anchor="middle">CERTIFICADO</text>

  <!-- Stepper Header -->
  <g transform="translate(100, 75)">
    <!-- Line -->
    <line x1="80" y1="20" x2="720" y2="20" stroke="#334155" stroke-width="3"/>
    <line x1="80" y1="20" x2="480" y2="20" stroke="#10B981" stroke-width="3"/>
    
    <!-- Step 1 -->
    <circle cx="80" cy="20" r="16" fill="#10B981"/>
    <path d="M74 20 L78 24 L86 16" stroke="#FFFFFF" stroke-width="2.5" fill="none" stroke-linecap="round"/>
    <text x="80" y="52" fill="#F8FAFC" font-size="11.5" font-weight="700" text-anchor="middle">1. Términos</text>

    <!-- Step 2 -->
    <circle cx="280" cy="20" r="16" fill="#10B981"/>
    <path d="M274 20 L278 24 L286 16" stroke="#FFFFFF" stroke-width="2.5" fill="none" stroke-linecap="round"/>
    <text x="280" y="52" fill="#F8FAFC" font-size="11.5" font-weight="700" text-anchor="middle">2. Clave OTP</text>

    <!-- Step 3 (Active) -->
    <circle cx="480" cy="20" r="18" fill="#38BDF8" filter="url(#glow)"/>
    <text x="480" y="25" fill="#0F172A" font-size="12" font-weight="900" text-anchor="middle">3</text>
    <text x="480" y="52" fill="#38BDF8" font-size="11.5" font-weight="800" text-anchor="middle">3. Biometría Facial</text>

    <!-- Step 4 -->
    <circle cx="720" cy="20" r="16" fill="#1E293B" stroke="#475569" stroke-width="2"/>
    <text x="720" y="24" fill="#64748B" font-size="11" font-weight="800" text-anchor="middle">4</text>
    <text x="720" y="52" fill="#64748B" font-size="11.5" font-weight="600" text-anchor="middle">4. Sellado Digital</text>
  </g>

  <!-- Main View Area: Left Camera Scanner / Right DNI Matching -->
  <g transform="translate(60, 160)">
    
    <!-- LEFT PANEL: Real-time Camera with Face Mesh -->
    <rect x="0" y="0" width="410" height="310" rx="14" fill="#1E293B" stroke="#334155" stroke-width="1.5"/>
    <text x="24" y="32" fill="#F8FAFC" font-size="14" font-weight="800">Cámara Frontal: Detección de Vida (Liveness)</text>
    
    <!-- Camera Viewport -->
    <rect x="24" y="48" width="362" height="210" rx="10" fill="#0B132B"/>
    
    <!-- Face Silhouette / Mesh -->
    <ellipse cx="205" cy="140" rx="55" ry="72" fill="none" stroke="#38BDF8" stroke-width="2.5" stroke-dasharray="6,4"/>
    <circle cx="185" cy="125" r="5" fill="#38BDF8"/>
    <circle cx="225" cy="125" r="5" fill="#38BDF8"/>
    <path d="M205 133 L205 148 L198 152" fill="none" stroke="#38BDF8" stroke-width="2"/>
    <path d="M190 170 Q205 180 220 170" fill="none" stroke="#38BDF8" stroke-width="2.5" stroke-linecap="round"/>
    
    <!-- Scanning Radar/Reticle Lines -->
    <line x1="120" y1="140" x2="140" y2="140" stroke="#10B981" stroke-width="3"/>
    <line x1="270" y1="140" x2="290" y2="140" stroke="#10B981" stroke-width="3"/>
    <line x1="205" y1="60" x2="205" y2="78" stroke="#10B981" stroke-width="3"/>
    <line x1="205" y1="205" x2="205" y2="222" stroke="#10B981" stroke-width="3"/>

    <!-- Liveness Active Pill -->
    <rect x="40" y="60" width="130" height="26" rx="13" fill="rgba(16, 185, 129, 0.2)" stroke="#10B981" stroke-width="1.5"/>
    <circle cx="54" cy="73" r="4" fill="#10B981"/>
    <text x="66" y="77" fill="#6EE7B7" font-size="11" font-weight="700">Rostro Detectado</text>

    <!-- Bottom Status -->
    <text x="24" y="285" fill="#94A3B8" font-size="12">Parpadee suavemente frente a la cámara...</text>
    <rect x="290" y="268" width="96" height="28" rx="6" fill="#10B981"/>
    <text x="338" y="286" fill="#FFFFFF" font-size="11" font-weight="800" text-anchor="middle">✓ CAPTURADO</text>


    <!-- RIGHT PANEL: DNI & AWS Rekognition Match -->
    <rect x="440" y="0" width="440" height="310" rx="14" fill="#1E293B" stroke="#334155" stroke-width="1.5"/>
    <text x="464" y="32" fill="#F8FAFC" font-size="14" font-weight="800">Cotejo Biométrico vs. Documento (DNI)</text>

    <!-- DNI Card Preview -->
    <rect x="464" y="48" width="220" height="135" rx="8" fill="#334155" stroke="#475569" stroke-width="1.5"/>
    <rect x="480" y="66" width="48" height="60" rx="4" fill="#1E293B" stroke="#64748B"/>
    <circle cx="504" cy="90" r="14" fill="#475569"/>
    <path d="M490 120 C490 108 518 108 518 120" fill="#475569"/>
    <!-- DNI Lines -->
    <rect x="540" y="70" width="120" height="8" rx="3" fill="#94A3B8"/>
    <rect x="540" y="86" width="95" height="7" rx="3" fill="#64748B"/>
    <rect x="540" y="100" width="75" height="7" rx="3" fill="#64748B"/>
    <rect x="540" y="115" width="105" height="7" rx="3" fill="#475569"/>
    <text x="574" y="170" fill="#CBD5E1" font-size="9.5" font-weight="600" text-anchor="middle">DNI FRENTE OFICIAL</text>

    <!-- Matching Engine Badge -->
    <rect x="704" y="55" width="160" height="120" rx="10" fill="#0B132B" stroke="#10B981" stroke-width="1.5"/>
    <text x="784" y="78" fill="#94A3B8" font-size="10" font-weight="700" text-anchor="middle">AWS REKOGNITION</text>
    <text x="784" y="114" fill="#34D399" font-size="28" font-weight="900" text-anchor="middle">98.4%</text>
    <text x="784" y="132" fill="#6EE7B7" font-size="10" font-weight="700" text-anchor="middle">COINCIDENCIA (MATCH)</text>
    <text x="784" y="156" fill="#94A3B8" font-size="9" text-anchor="middle">Mínimo legal requerido: 90%</text>

    <!-- Verification Audit Log -->
    <g transform="translate(464, 198)">
      <rect x="0" y="0" width="400" height="98" rx="8" fill="#0F172A" stroke="#334155" stroke-width="1"/>
      <text x="14" y="22" fill="#38BDF8" font-size="11" font-weight="800">AUDITORÍA DE INTEGRIDAD DIGITAL</text>
      <text x="14" y="42" fill="#CBD5E1" font-size="10.5">Firmante: <tspan fill="#FFFFFF" font-weight="700">Carlos Inquilino</tspan> (DNI: 35.842.190)</text>
      <text x="14" y="60" fill="#CBD5E1" font-size="10.5">OTP Verificado: <tspan fill="#34D399" font-weight="700">#842915</tspan> (Válido por 10 min vía correo)</text>
      <text x="14" y="78" fill="#CBD5E1" font-size="10.5">Firma Criptográfica: <tspan fill="#94A3B8" font-family="monospace">SHA-256 e3b0c44298fc1c149afbf4c8...</tspan></text>
      <circle cx="370" cy="50" r="14" fill="#10B981"/>
      <path d="M364 50 L368 54 L376 46" stroke="#FFFFFF" stroke-width="2.5" fill="none" stroke-linecap="round"/>
    </g>

  </g>
</svg>
