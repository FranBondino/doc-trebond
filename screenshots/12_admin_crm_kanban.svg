<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 520" width="100%" height="100%" style="background:#F8FAFC; border-radius:12px; font-family:'Inter', system-ui, sans-serif;">
  <!-- Window top bar -->
  <rect x="0" y="0" width="1000" height="48" fill="#1E293B"/>
  <circle cx="25" cy="24" r="5" fill="#EF4444"/>
  <circle cx="42" cy="24" r="5" fill="#F59E0B"/>
  <circle cx="59" cy="24" r="5" fill="#10B981"/>
  <text x="500" y="30" fill="#94A3B8" font-size="12" font-weight="600" text-anchor="middle">trebond-frontend.vercel.app/admin/crm — Pipeline Comercial y Embudo de Ventas / Alquileres</text>

  <!-- Top Action Header -->
  <g transform="translate(30, 68)">
    <text x="0" y="24" fill="#262960" font-size="20" font-weight="900">CRM Comercial (Kanban)</text>
    <text x="0" y="44" fill="#64748B" font-size="12">Seguimiento de prospectos, visitas agendadas, reservas y cierres comerciales</text>
    
    <rect x="740" y="6" width="190" height="36" rx="8" fill="#262960"/>
    <text x="835" y="29" fill="#FFFFFF" font-size="12" font-weight="700" text-anchor="middle">+ Nuevo Prospecto</text>
  </g>

  <!-- Kanban Columns -->
  <g transform="translate(30, 130)">
    <!-- Col 1: Nuevo Lead -->
    <rect x="0" y="0" width="176" height="360" rx="8" fill="#F1F5F9" stroke="#E2E8F0"/>
    <text x="14" y="24" fill="#262960" font-size="11" font-weight="800">1. NUEVO LEAD (3)</text>
    <rect x="10" y="36" width="156" height="88" rx="6" fill="#FFFFFF" stroke="#CBD5E1"/>
    <text x="18" y="54" fill="#0F172A" font-size="11" font-weight="800">Esteban Gómez</text>
    <text x="18" y="70" fill="#64748B" font-size="10">Interés: Alquiler 2 amb</text>
    <text x="18" y="86" fill="#0284C7" font-size="9.5" font-weight="700">Origen: Portal Web</text>
    <rect x="18" y="96" width="70" height="18" rx="4" fill="#EFF6FF"/>
    <text x="53" y="109" fill="#1E40AF" font-size="8.5" font-weight="700" text-anchor="middle">Hace 15 min</text>

    <!-- Col 2: Contactado -->
    <rect x="190" y="0" width="176" height="360" rx="8" fill="#F1F5F9" stroke="#E2E8F0"/>
    <text x="204" y="24" fill="#262960" font-size="11" font-weight="800">2. CONTACTADO (2)</text>
    <rect x="200" y="36" width="156" height="88" rx="6" fill="#FFFFFF" stroke="#CBD5E1"/>
    <text x="208" y="54" fill="#0F172A" font-size="11" font-weight="800">Valeria Rossi</text>
    <text x="208" y="70" fill="#64748B" font-size="10">WhatsApp enviado</text>
    <text x="208" y="86" fill="#166534" font-size="9.5" font-weight="700">Bv. Oroño 1420</text>
    <rect x="208" y="96" width="70" height="18" rx="4" fill="#DCFCE7"/>
    <text x="243" y="109" fill="#166534" font-size="8.5" font-weight="700" text-anchor="middle">Respondió</text>

    <!-- Col 3: Visita Agendada -->
    <rect x="380" y="0" width="176" height="360" rx="8" fill="#F1F5F9" stroke="#E2E8F0"/>
    <text x="394" y="24" fill="#0284C7" font-size="11" font-weight="800">3. VISITA AGENDADA (4)</text>
    <rect x="390" y="36" width="156" height="96" rx="6" fill="#FFFFFF" stroke="#CBD5E1"/>
    <text x="398" y="54" fill="#0F172A" font-size="11" font-weight="800">Martín Salcedo</text>
    <text x="398" y="70" fill="#D97706" font-size="10" font-weight="700">Mañana 17:00 hs</text>
    <text x="398" y="86" fill="#64748B" font-size="9.5">Córdoba 2150 2do B</text>
    <rect x="398" y="98" width="80" height="20" rx="4" fill="#FEF3C7"/>
    <text x="438" y="112" fill="#B45309" font-size="8.5" font-weight="800" text-anchor="middle">Agente: Sofía B.</text>

    <!-- Col 4: Oferta / Reserva -->
    <rect x="570" y="0" width="176" height="360" rx="8" fill="#F1F5F9" stroke="#E2E8F0"/>
    <text x="584" y="24" fill="#7C3AED" font-size="11" font-weight="800">5. RESERVA / OFERTA (1)</text>
    <rect x="580" y="36" width="156" height="96" rx="6" fill="#FFFFFF" stroke="#CBD5E1"/>
    <text x="588" y="54" fill="#0F172A" font-size="11" font-weight="800">Camila Duarte</text>
    <text x="588" y="70" fill="#166534" font-size="10" font-weight="800">Reserva: $100.000</text>
    <text x="588" y="86" fill="#64748B" font-size="9.5">Paraguay 850 1er P</text>
    <rect x="588" y="98" width="90" height="20" rx="4" fill="#F3E8FF"/>
    <text x="633" y="112" fill="#6B21A8" font-size="8.5" font-weight="800" text-anchor="middle">Contrato en Prep.</text>

    <!-- Col 5: Cerrado Ganado -->
    <rect x="760" y="0" width="180" height="360" rx="8" fill="#F0FDF4" stroke="#BBF7D0"/>
    <text x="774" y="24" fill="#166534" font-size="11" font-weight="800">✓ GANADO / ALQUILADO (5)</text>
    <rect x="770" y="36" width="160" height="96" rx="6" fill="#FFFFFF" stroke="#86EFAC"/>
    <text x="778" y="54" fill="#0F172A" font-size="11" font-weight="800">Carlos Inquilino</text>
    <text x="778" y="70" fill="#166534" font-size="10" font-weight="800">Alquiler Firmado</text>
    <text x="778" y="86" fill="#64748B" font-size="9.5">Bv. Oroño 1420 4to A</text>
    <rect x="778" y="98" width="105" height="20" rx="4" fill="#DCFCE7"/>
    <text x="830" y="112" fill="#166534" font-size="8.5" font-weight="800" text-anchor="middle">Firma Biomet. OK</text>
